name: Warehousing1
description: 'Warehousing1 is a Berlin-based LogTech company, founded in 2018 by Nico
  Szeli, Nils Aschmann and Fabian Sedlmayr, that operates a digital fulfillment and
  warehousing marketplace connecting brands and e-commerce merchants to an independent
  network of more than 1,000 logistics locations across Germany, Europe and the US.
  Its cloud platform and customer portal centralize warehousing, order picking, packing
  and shipping, and integrate with common ERP systems, online shops and marketplaces
  so companies can scale contract logistics, distribution and e-commerce fulfillment.
  The company has served 500+ customers and is backed by HV Capital, Schenker Ventures,
  Aster Capital and Wille Finance. Warehousing1 does not publish a public developer
  API; integration is delivered through managed ERP/shop connectors and its customer
  portal.'
